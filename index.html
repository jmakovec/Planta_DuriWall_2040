<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DuriWall Planta 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#EDEFEA;
  --panel:rgba(250,251,248,.94);
  --panel-solid:#FAFBF8;
  --ink:#1D2621;
  --muted:#5E6B63;
  --line:#C8D0C9;
  --green:#BFE3C4;
  --green-ink:#3F6B4C;
  --orange:#F07A1A;
  --orange-ink:#B4520A;
  --red:#D8322A;
  --wall:#7B2B2B;
  --display:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:14px;overflow:hidden;}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper);}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#labels,#overlay{position:absolute;inset:0;pointer-events:none;}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font:500 11px/1 var(--display);letter-spacing:.04em;color:var(--green-ink);background:rgba(250,251,248,.9);border:1px solid #9FC7A7;padding:4px 7px 4px;border-radius:3px;will-change:transform;}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;width:1px;height:6px;background:#9FC7A7;}
.tag.zone{font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);border-color:var(--line);}
.tag.zone::after{display:none;}
body.nolabels .tag{display:none;}

/* Tarjeta flotante del bloque */
#card{position:absolute;left:0;top:0;width:262px;max-width:calc(100vw - 32px);transform:translate(-50%,calc(-100% - 18px));background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:4px;box-shadow:0 10px 28px rgba(29,38,33,.16);padding:10px 12px 11px;will-change:transform;pointer-events:none;}
#card::after{content:"";position:absolute;left:50%;bottom:-41px;width:2px;height:40px;margin-left:-1px;background:var(--orange);}
#card::before{content:"";position:absolute;left:50%;bottom:-45px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(240,122,26,.25);}
#card.docked::before{display:none;}
#card.docked::after{display:none;}
#card .eyebrow{display:flex;justify-content:space-between;gap:8px;font:600 10.5px/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--orange-ink);}
#card h2{margin:5px 0 2px;font:600 16px/1.15 var(--display);letter-spacing:.01em;text-wrap:balance;}
#card .machine{font:500 12px/1.3 var(--display);color:var(--muted);}
#card dl{margin:7px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 9px;font:400 10.5px/1.35 var(--mono);font-variant-numeric:tabular-nums;}
#card dt{color:var(--muted);}
#card dd{margin:0;color:var(--ink);}
#card .now{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font:500 12px/1.3 var(--display);display:flex;gap:7px;align-items:baseline;}
#card .now b{font:500 10px/1 var(--mono);color:#fff;background:var(--orange);padding:3px 5px;border-radius:2px;letter-spacing:.04em;}
#card.bn{border-top-color:var(--red);}
#card.bn::after,#card.bn::before{background:var(--red);}
#card.bn .eyebrow{color:var(--red);}
#card.bn .now b{background:var(--red);}

/* Etiqueta cuello de botella */
#btag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;background:var(--red);color:#fff;padding:6px 10px 7px;border-radius:3px;box-shadow:0 0 0 4px rgba(216,50,42,.18),0 8px 20px rgba(216,50,42,.35);white-space:nowrap;}
#btag small{display:block;font:600 9.5px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;opacity:.9;}
#btag span{display:block;margin-top:3px;font:600 13px/1.1 var(--display);}
#btag::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--red);border-bottom:0;}
#btag.below::after{bottom:auto;top:-8px;border-top:0;border-bottom:6px solid var(--red);}

/* Rótulo tipo plano */
.rotulo{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;display:grid;grid-template-columns:auto auto;border:1.5px solid var(--ink);background:var(--panel-solid);font-family:var(--display);max-width:calc(100vw - 32px);}
.rotulo .brand{padding:8px 12px;border-right:1.5px solid var(--ink);display:flex;flex-direction:column;justify-content:center;}
.rotulo .brand strong{font:700 18px/1 var(--display);letter-spacing:.2em;}
.rotulo .brand em{font:500 11.5px/1.2 var(--display);font-style:normal;letter-spacing:.08em;color:var(--muted);margin-top:5px;}
.rotulo .cur{padding:7px 12px;display:flex;flex-direction:column;justify-content:center;min-width:200px;}
.rotulo .cur small{font:600 9.5px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.rotulo .cur span{font:600 14px/1.2 var(--display);margin-top:4px;}

/* Barra de reproducción */
.transport{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(237,239,234,.97) 60%,rgba(237,239,234,0));display:flex;flex-direction:column;gap:8px;}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font:500 12px/1 var(--display);color:var(--ink);background:var(--panel-solid);border:1px solid var(--line);border-radius:3px;padding:6px 9px;cursor:pointer;}
.chip i{font:500 10px/1 var(--mono);font-style:normal;color:var(--muted);}
.chip:hover{border-color:var(--green-ink);}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.chip.on i{color:#F5A15C;}
.chip.bnchip i{color:var(--red);}
.chip.on.bnchip i{color:#FF8D86;}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.btn{font:500 12px/1 var(--display);color:var(--ink);background:var(--panel-solid);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--green-ink);}
.btn[aria-pressed="true"]{background:var(--green);border-color:var(--green-ink);}
.btn.play{width:38px;height:32px;justify-content:center;padding:0;background:var(--orange);border-color:var(--orange-ink);color:#fff;}
.btn.play svg{width:14px;height:14px;fill:currentColor;}
.btn.icon{width:32px;height:32px;padding:0;justify-content:center;}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
.scrub{flex:1 1 260px;position:relative;height:32px;display:flex;align-items:center;min-width:180px;}
.scrub .ticks{position:absolute;left:0;right:0;top:50%;height:12px;margin-top:-6px;pointer-events:none;}
.scrub .ticks span{position:absolute;top:0;width:1px;height:12px;background:var(--muted);opacity:.55;}
.scrub .ticks span.bn{background:var(--red);opacity:1;width:2px;}
#scrub{width:100%;appearance:none;-webkit-appearance:none;background:transparent;height:32px;margin:0;cursor:pointer;position:relative;}
#scrub::-webkit-slider-runnable-track{height:4px;background:linear-gradient(to right,var(--orange) var(--p,0%),#C3CBC4 var(--p,0%));border-radius:2px;}
#scrub::-moz-range-track{height:4px;background:linear-gradient(to right,var(--orange) var(--p,0%),#C3CBC4 var(--p,0%));border-radius:2px;}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:var(--panel-solid);border:2px solid var(--orange);}
#scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel-solid);border:2px solid var(--orange);}
.time{font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px;text-align:center;}
.sel{font:500 12px/1 var(--display);color:var(--ink);background:var(--panel-solid);border:1px solid var(--line);border-radius:3px;padding:6px 8px;}
.bnsel{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--red);}
.bnsel .sel{border-color:#E7A09B;letter-spacing:0;text-transform:none;font-weight:500;max-width:220px;}
.spacer{flex:1;}
body.clean .transport,body.clean .rotulo{opacity:0;pointer-events:none;}
body.clean .transport:hover{opacity:1;pointer-events:auto;}
.transport,.rotulo{transition:opacity .25s;}
.hint{position:absolute;left:16px;bottom:calc(124px + env(safe-area-inset-bottom,0px));font:400 11px/1.4 var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 9px;border-radius:3px;max-width:260px;}
.hint[hidden]{display:none!important;}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);font:500 13px/1.4 var(--display);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
#loading.err{color:var(--red);text-transform:none;letter-spacing:0;padding:24px;text-align:center;}
@media (max-width:640px){
  .rotulo .brand strong{font-size:14px;}
  .rotulo .cur{min-width:0;}
  .rotulo .cur span{font-size:12px;}
  #card{width:230px;padding:8px 10px;}
  #card h2{font-size:15px;}
  #card dl{font-size:10px;}
  .hide-sm{display:none!important;}
  .scrub{flex-basis:100%;order:5;}
}
@media (prefers-reduced-motion: reduce){.transport,.rotulo{transition:none;}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Animación 3D de la planta DuriWall"></canvas>
  <div id="labels"></div>
  <div id="overlay">
    <div id="btag" hidden><small>Cuello de botella</small><span id="btagName">Kimla BPF2030</span></div>
    <div id="card" hidden>
      <div class="eyebrow"><span id="cEyebrow">Etapa 1 de 7</span><span id="cCode">SEB1</span></div>
      <h2 id="cTitle">Corte de placa cementicia</h2>
      <div class="machine" id="cMachine">Kimla BPF2030</div>
      <dl id="cData"></dl>
      <div class="now"><b id="cBadge">AHORA</b><span id="cNow">—</span></div>
    </div>
  </div>
  <header class="rotulo">
    <div class="brand"><strong>DURIWALL</strong><em>Ortiz &amp; Makovec</em></div>
    <div class="cur"><small id="hEyebrow">Recorrido del bloque</small><span id="hTitle">Vista general del predio</span></div>
  </header>
  <div class="hint" id="freeHint" hidden>Vista libre: arrastrá para girar, rueda o pellizco para acercar, clic derecho para desplazar.</div>
  <footer class="transport">
    <div class="chips" id="chips" role="tablist" aria-label="Etapas"></div>
    <div class="row">
      <button class="btn play" id="play" aria-label="Pausar"><svg viewBox="0 0 14 14" id="playIcon"><rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/></svg></button>
      <div class="scrub"><div class="ticks" id="ticks"></div><input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Línea de tiempo"></div>
      <span class="time" id="time">0:00 / 0:00</span>
      <select class="sel" id="speed" aria-label="Velocidad">
        <option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option>
      </select>
      <label class="bnsel hide-sm" for="bnSel">Cuello
        <select class="sel" id="bnSel"></select>
      </label>
      <button class="btn" id="free" aria-pressed="false">Vista libre</button>
      <button class="btn hide-sm" id="lbl" aria-pressed="true">Etiquetas</button>
      <button class="btn hide-sm" id="clean" aria-pressed="false" title="Oculta la interfaz para grabar la pantalla (tecla H)">Grabar</button>
      <button class="btn hide-sm icon" id="fs" aria-label="Pantalla completa" title="Pantalla completa"><svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
    </div>
  </footer>
  <div id="loading">Cargando planta…</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

try { await Promise.race([document.fonts.load('600 64px Jost'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}

/* ============================================================
   DuriWall · Layout de planta 3D
   Coordenadas en metros. X = derecha del plano, Z = abajo del plano, Y = altura.
   L(lx,ly): px del layout de línea (59 px/m) → metros del predio.
   S(sx,sy): px del plano de implantación (13,34 px/m) → metros del predio.
   ============================================================ */
const L = (lx, ly) => [36.68 + (lx - 545) / 59, 17.17 + (ly - 322) / 59];
const S = (sx, sy) => [(sx - 50) / 13.34, (sy - 35) / 13.34];

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const angLerp = (a, b, k) => { let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; return a + d * k; };

/* ---------- Renderer / escena ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#E6E9E3');
scene.fog = new THREE.Fog('#E6E9E3', 140, 260);

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 600);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enabled = false;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 3;
controls.maxDistance = 180;

scene.add(new THREE.HemisphereLight('#FFFFFF', '#C9D2C8', 1.35));
const sun = new THREE.DirectionalLight('#FFF6E8', 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
const SH = 26;
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 1, far: 160 });
scene.add(sun, sun.target);

/* ---------- Materiales ---------- */
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0.02, ...o });
const M = {
  ground: std('#DCE0D8'),
  asphalt: std('#C7CBC4', { roughness: 0.95 }),
  island: std('#F4F5F0'),
  curb: std('#C5CAC3'),
  tiles: std('#E7E3DA'),
  wall: std('#E5E3DE'),
  cap: std('#7B2B2B'),
  roof: std('#D9DEDA', { transparent: true, opacity: 1, roughness: 0.7 }),
  green: std('#BFE3C4'),
  green2: std('#A8D6B0'),
  steel: std('#9AA59F', { metalness: 0.35, roughness: 0.5 }),
  dark: std('#38423C', { roughness: 0.6 }),
  belt: std('#2E3632', { roughness: 0.9 }),
  roller: std('#B9C1BB', { metalness: 0.4, roughness: 0.45 }),
  cement: std('#B6B2A9', { roughness: 0.95 }),
  eps: std('#F8F8F3', { roughness: 0.9 }),
  orange: std('#F07A1A', { emissive: '#7A3000', emissiveIntensity: 0.35, roughness: 0.6 }),
  orangeLight: std('#F8AE68', { emissive: '#7A3A00', emissiveIntensity: 0.25, roughness: 0.7 }),
  glue: std('#FFE16A', { emissive: '#8A6A00', emissiveIntensity: 0.55, roughness: 0.35 }),
  wood: std('#CBA779'),
  robot: std('#EDF0EE', { roughness: 0.55 }),
  joint: std('#3A443F', { roughness: 0.5 }),
  fork: std('#F2C230', { roughness: 0.6 }),
  tire: std('#262B28'),
  skin: std('#D9A98A'),
  suit: std('#3E5C74'),
  vest: std('#D6E64A', { emissive: '#3A4200', emissiveIntensity: 0.15 }),
  helmet: std('#FAFAF7'),
  wire: new THREE.MeshBasicMaterial({ color: '#FF5B3A' }),
  glass: std('#AFC6CF', { transparent: true, opacity: 0.55, roughness: 0.2 }),
  truckCab: std('#F4F6F3', { roughness: 0.5 }),
  load: std('#BFE3C4'),
  film: std('#DDE7EE', { transparent: true, opacity: 0.55, roughness: 0.25 }),
  fence: std('#8FA79A', { transparent: true, opacity: 0.13, roughness: 0.5, side: THREE.DoubleSide, depthWrite: false }),
  bnBody: std('#F0A39B', { emissive: '#D8322A', emissiveIntensity: 0.6 }),
  bnShell: new THREE.MeshBasicMaterial({ color: '#FF3B2F', transparent: true, opacity: 0.12, side: THREE.BackSide, depthWrite: false }),
  bnFloor: new THREE.MeshBasicMaterial({ color: '#FF3B2F', transparent: true, opacity: 0.35, depthWrite: false }),
};
const EDGE = new THREE.LineBasicMaterial({ color: '#4E7D5B', transparent: true, opacity: 0.55 });
const EDGE_DARK = new THREE.LineBasicMaterial({ color: '#2B332E', transparent: true, opacity: 0.35 });

/* ---------- Helpers de geometría ---------- */
const BOX = new THREE.BoxGeometry(1, 1, 1);
const EDGE_BOX = new THREE.EdgesGeometry(BOX);
function bx(parent, w, h, d, mat, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(w, h, d);
  m.position.set(x, y + h / 2, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.receive !== false;
  if (o.edges) {
    const e = new THREE.LineSegments(EDGE_BOX, o.edges === true ? EDGE : o.edges);
    m.add(e);
  }
  parent.add(m);
  return m;
}
function cyl(parent, r, h, mat, x = 0, y = 0, z = 0, seg = 24, o = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(o.rTop ?? r, r, h, seg), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = o.cast !== false; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function group(parent = scene, x = 0, z = 0, y = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g;
}
function flatShape(points) { // points [x,z] → Shape in XY with y=-z
  const s = new THREE.Shape();
  points.forEach((p, i) => i ? s.lineTo(p[0], -p[1]) : s.moveTo(p[0], -p[1]));
  return s;
}
function flatMesh(points, mat, y = 0, depth = 0) {
  const shape = flatShape(points);
  const geo = depth > 0 ? new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false }) : new THREE.ShapeGeometry(shape);
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI / 2;
  m.position.y = y;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function arcPts(cx, cz, r, a0, a1, n = 10) { // ángulos en el plano (x=cos, z=sin)
  const out = [];
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); out.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]); }
  return out;
}
function roundRect(x0, z0, x1, z1, r) {
  return [
    ...arcPts(x0 + r, z0 + r, r, Math.PI, Math.PI * 1.5),
    ...arcPts(x1 - r, z0 + r, r, -Math.PI / 2, 0),
    ...arcPts(x1 - r, z1 - r, r, 0, Math.PI / 2),
    ...arcPts(x0 + r, z1 - r, r, Math.PI / 2, Math.PI),
  ];
}

/* Texto pintado sobre el piso (como en el plano) */
function floorText(text, x, z, size = 1.1, o = {}) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const px = 64;
  const font = `${o.weight || 600} ${px}px Jost, Futura, "Century Gothic", sans-serif`;
  ctx.font = font;
  const spacing = (o.spacing ?? 0.16) * px;
  const chars = [...text];
  let w = 0; chars.forEach(ch => w += ctx.measureText(ch).width + spacing); w -= spacing;
  c.width = Math.ceil(w + 24); c.height = Math.ceil(px * 1.35);
  ctx.font = font; ctx.fillStyle = o.color || 'rgba(29,38,33,0.72)'; ctx.textBaseline = 'middle';
  let cx = 12; chars.forEach(ch => { ctx.fillText(ch, cx, c.height / 2); cx += ctx.measureText(ch).width + spacing; });

/* Paths (recorridos) con esquinas redondeadas y parámetro por longitud */
function roundedPolyline(pts, r = 1.5, step = 0.35) {
  const out = [];
  const push = p => { const l = out[out.length - 1]; if (!l || Math.hypot(l[0] - p[0], l[1] - p[1]) > 1e-4) out.push(p); };
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (i === 0 || i === pts.length - 1) { push(p); continue; }
    const a = pts[i - 1], b = pts[i + 1];
    const la = Math.hypot(p[0] - a[0], p[1] - a[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const rr = Math.min(r, la / 2, lb / 2);
    const p0 = [p[0] + (a[0] - p[0]) / la * rr, p[1] + (a[1] - p[1]) / la * rr];
    const p1 = [p[0] + (b[0] - p[0]) / lb * rr, p[1] + (b[1] - p[1]) / lb * rr];
    push(p0);
    for (let k = 1; k <= 8; k++) { const u = k / 8; const v = 1 - u; push([v * v * p0[0] + 2 * v * u * p[0] + u * u * p1[0], v * v * p0[1] + 2 * v * u * p[1] + u * u * p1[1]]); }
  }
  // re-muestreo uniforme
  const res = [out[0]]; let acc = 0;
  for (let i = 1; i < out.length; i++) {
    const a = out[i - 1], b = out[i]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let d = step - acc;
    while (d <= l) { const k = d / l; res.push([lerp(a[0], b[0], k), lerp(a[1], b[1], k)]); d += step; }
    acc = l - (d - step);
  }
  res.push(out[out.length - 1]);
  return res;
}
class Path {
  constructor(pts, r = 1.5) {
    this.p = roundedPolyline(pts, r);
    this.c = [0];
    for (let i = 1; i < this.p.length; i++) this.c.push(this.c[i - 1] + Math.hypot(this.p[i][0] - this.p[i - 1][0], this.p[i][1] - this.p[i - 1][1]));
    this.len = this.c[this.c.length - 1];
  }
  at(s) { // → {x,z,a} a = heading (rotación Y para que +X local mire hacia adelante)
    s = clamp(s, 0, this.len);
    let lo = 0, hi = this.c.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (this.c[m] <= s) lo = m; else hi = m; }
    const a = this.p[lo], b = this.p[hi]; const l = this.c[hi] - this.c[lo] || 1; const k = (s - this.c[lo]) / l;
    return { x: lerp(a[0], b[0], k), z: lerp(a[1], b[1], k), a: Math.atan2(-(b[1] - a[1]), b[0] - a[0]) };
  }
}

  else if (along === 'x') { bx(g, w, 0.07, 0.04, M.steel, cx, h, z0 + 0.03); bx(g, w, 0.07, 0.04, M.steel, cx, h, z1 - 0.03); }
  else { bx(g, 0.04, 0.07, d, M.steel, x0 + 0.03, h, cz); bx(g, 0.04, 0.07, d, M.steel, x1 - 0.03, h, cz); }
  // patas
  const lx = [x0 + 0.1, x1 - 0.1], lz = [z0 + 0.1, z1 - 0.1];
  lx.forEach(a => lz.forEach(b => bx(g, 0.06, h - 0.23, 0.06, M.steel, a, 0, b)));
  return { g, h, bodies, surf, cx, cz, w, d };
}

/* Robot articulado de 6 ejes (IK plana + giro de base) */
function robot(parent, x, z, o = {}) {
  const L1 = o.L1 ?? 1.2, L2 = o.L2 ?? 1.15, H0 = o.H0 ?? 0.72, T = o.T ?? 0.2, s = o.s ?? 1;
  const g = group(parent, x, z);
  // huella verde del plano
  const disc = new THREE.Mesh(new THREE.CircleGeometry(o.r ?? 0.5, 40), std('#BFE3C4', { transparent: true, opacity: 0.85 }));
  disc.rotation.x = -Math.PI / 2; disc.position.y = 0.006; disc.receiveShadow = true; g.add(disc);
  const ring = new THREE.Mesh(new THREE.RingGeometry((o.r ?? 0.5) - 0.02, o.r ?? 0.5, 48), new THREE.MeshBasicMaterial({ color: '#4E7D5B' }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.008; g.add(ring);
  const bodies = [disc];
  cyl(g, 0.26 * s, 0.22, M.joint, 0, 0, 0, 24);
  const turret = group(g, 0, 0, 0.22);
  cyl(turret, 0.2 * s, H0 - 0.22 - 0.08, M.robot, 0, 0, 0, 20);
  const shoulder = group(turret, 0.1 * s, 0, H0 - 0.22);
  const sj = cyl(shoulder, 0.13 * s, 0.34 * s, M.joint, 0, -0.17 * s, 0, 20); sj.rotation.x = Math.PI / 2; sj.position.set(0, 0, 0);
  const upper = new THREE.Mesh(BOX, M.robot); upper.scale.set(L1, 0.17 * s, 0.17 * s); upper.position.x = L1 / 2; upper.castShadow = true; shoulder.add(upper);
  const elbow = group(shoulder, L1, 0, 0);
  const ej = cyl(elbow, 0.1 * s, 0.26 * s, M.joint, 0, 0, 0, 18); ej.rotation.x = Math.PI / 2; ej.position.set(0, 0, 0);
  const fore = new THREE.Mesh(BOX, M.robot); fore.scale.set(L2, 0.12 * s, 0.12 * s); fore.position.x = L2 / 2; fore.castShadow = true; elbow.add(fore);
  const wrist = group(elbow, L2, 0, 0);
  const wj = cyl(wrist, 0.07 * s, 0.18 * s, M.joint, 0, 0, 0, 16); wj.rotation.x = Math.PI / 2; wj.position.set(0, 0, 0);
  const tool = group(wrist);
  const flange = new THREE.Mesh(BOX, M.joint); flange.scale.set(T - 0.03, 0.08, 0.08); flange.position.x = (T - 0.03) / 2; tool.add(flange);
  const pad = new THREE.Mesh(BOX, M.dark); pad.scale.set(0.03, o.padW ?? 0.3, o.padD ?? 0.16); pad.position.x = T - 0.015; tool.add(pad);
  const R = {
    g, turret, shoulder, elbow, wrist, bodies, L1, L2, H0, T, x, z,
    home: o.home || [x + 0.6, 1.5, z],
    set(tx, ty, tz, padYaw = 0) {
      const dx = tx - x, dz = tz - z;
      const yaw = Math.atan2(-dz, dx);
      turret.rotation.y = yaw;
      let r = Math.hypot(dx, dz) - 0.1 * s;
      const hw = (ty + T) - (H0);
      let d = Math.hypot(r, hw);
      const maxd = L1 + L2 - 0.002;
      if (d > maxd) { r *= maxd / d; d = maxd; }
      const cq = clamp((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1);
      const q2 = Math.acos(cq);
      const a1 = Math.atan2(hw, r) + Math.atan2(L2 * Math.sin(q2), L1 + L2 * Math.cos(q2));
      shoulder.rotation.z = a1;
      elbow.rotation.z = -q2;
      wrist.rotation.z = -Math.PI / 2 - (a1 - q2);
      tool.rotation.x = padYaw;
    },
  };
  R.set(...R.home);
  return R;
}

/* Operario */
function person(parent, x, z, rot = 0, o = {}) {
  const g = group(parent, x, z); g.rotation.y = rot;
  const leg = std('#2F3F4E');
  bx(g, 0.13, 0.82, 0.14, leg, 0, 0, -0.1); bx(g, 0.13, 0.82, 0.14, leg, 0, 0, 0.1);
  bx(g, 0.26, 0.58, 0.44, M.suit, 0, 0.82, 0);
  bx(g, 0.28, 0.36, 0.46, M.vest, 0, 1.0, 0, { cast: false });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), M.skin); head.position.y = 1.56; head.castShadow = true; g.add(head);
  const hat = new THREE.Mesh(new THREE.SphereGeometry(0.135, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), M.helmet); hat.position.y = 1.6; g.add(hat);
  const arm = side => { const a = group(g, 0, side * 0.29, 1.36); bx(a, 0.1, 0.6, 0.1, M.suit, 0, -0.6, 0); return a; };
  const armL = arm(-1), armR = arm(1);
  return { g, armL, armR, pose(k) { armL.rotation.z = armR.rotation.z = k * 1.25; } };
}

/* Autoelevador (frente = +X local) */
function forklift(parent) {
  const g = group(parent);
  bx(g, 1.55, 0.75, 1.08, M.fork, -0.15, 0.25, 0, { edges: EDGE_DARK });
  bx(g, 0.55, 0.85, 1.08, std('#3B4540'), -0.95, 0.2, 0);
  bx(g, 0.5, 0.45, 0.6, M.dark, -0.2, 1.0, 0);
  [[0.55, 0.5], [0.55, -0.5], [-0.7, 0.5], [-0.7, -0.5]].forEach(p => bx(g, 0.05, 1.2, 0.05, M.dark, p[0] - 0.1, 1.0, p[1]));
  bx(g, 1.35, 0.06, 1.08, M.dark, -0.18, 2.2, 0);
  [[0.45, 0.45], [0.45, -0.45], [-0.85, 0.45], [-0.85, -0.45]].forEach(p => { const w = cyl(g, 0.26, 0.2, M.tire, p[0], 0, p[1], 14); w.rotation.x = Math.PI / 2; w.position.y = 0.26; });
  // mástil
  bx(g, 0.1, 2.3, 0.08, M.dark, 0.68, 0.05, 0.3); bx(g, 0.1, 2.3, 0.08, M.dark, 0.68, 0.05, -0.3);
  const car = group(g, 0.75, 0, 0.08);
  bx(car, 0.06, 0.6, 0.85, M.dark, 0, 0, 0);
  bx(car, 1.1, 0.045, 0.12, M.steel, 0.58, 0, 0.3); bx(car, 1.1, 0.045, 0.12, M.steel, 0.58, 0, -0.3);
  const driver = person(g, -0.35, 0, 0); driver.g.position.y = 0.35; driver.g.scale.setScalar(0.9);
  driver.g.children[0].visible = driver.g.children[1].visible = false; // piernas ocultas (sentado)
  return { g, car, forkTip: 1.15, lift(h) { car.position.y = 0.08 + h; } };
}

/* Marco de hilo caliente (Polyformas). axis: 'x' → hilos distribuidos a lo largo de X (plano de corte fijo en z) */
function wireFrame(parent, cx, cz, span, axis, spacing, h0 = 0.72, H = 0.55) {
  const g = group(parent, cx, cz);
  if (axis === 'x') g.rotation.y = 0; else g.rotation.y = Math.PI / 2;
  const bodies = [];
  bodies.push(bx(g, 0.1, h0 + H + 0.1, 0.12, M.green2, -span / 2 - 0.08, 0, 0, { edges: true }));
  bodies.push(bx(g, 0.1, h0 + H + 0.1, 0.12, M.green2, span / 2 + 0.08, 0, 0, { edges: true }));
  bodies.push(bx(g, span + 0.28, 0.12, 0.14, M.green2, 0, h0 + H + 0.1, 0, { edges: true }));
  const n = Math.round(span / spacing);
  for (let i = 1; i < n; i++) bx(g, 0.012, H + 0.1, 0.012, M.wire, -span / 2 + i * spacing, h0, 0, { cast: false, receive: false });
  return { g, bodies };
}

/* Prensa neumática en frío Marzica PF21 (2.40 × 1.30 m) */
const BLOCK_GEO = new THREE.BoxGeometry(0.2, 0.132, 0.4);
const PRESS_BLOCK_GEO = new THREE.BoxGeometry(0.188, 0.132, 0.37);
function press(parent, x0, z0, x1, z1) {
  const g = group(parent);
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, w = x1 - x0, d = z1 - z0;
  const bodies = [];
  bodies.push(bx(g, w, 0.72, d, M.green, cx, 0, cz, { edges: true }));
  bx(g, w - 0.06, 0.06, d - 0.06, std('#D9DDD7'), cx, 0.72, cz);
  [[x0 + 0.08, z0 + 0.08], [x1 - 0.08, z0 + 0.08], [x0 + 0.08, z1 - 0.08], [x1 - 0.08, z1 - 0.08]].forEach(p => bodies.push(bx(g, 0.12, 2.0, 0.12, M.green2, p[0], 0, p[1], { edges: true })));
  bodies.push(bx(g, w, 0.16, 0.14, M.green2, cx, 1.98, z0 + 0.08, { edges: true }));
  bodies.push(bx(g, w, 0.16, 0.14, M.green2, cx, 1.98, z1 - 0.08, { edges: true }));
  for (let i = 0; i < 4; i++) bodies.push(bx(g, 0.18, 0.16, d, M.green2, x0 + 0.15 + i * (w - 0.3) / 3, 1.98, cz, { edges: true }));
  const cyls = [];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) cyls.push(cyl(g, 0.07, 0.5, M.steel, x0 + w * (i + 1) / 4, 1.5, z0 + d * (j + 1) / 3, 12));
  const platen = bx(g, w - 0.2, 0.08, d - 0.3, std('#C9CFCA', { metalness: 0.3, roughness: 0.5 }), cx, 1.45, cz, { edges: EDGE_DARK });
  // bloques cargados (1 nivel de 36)
  const inst = new THREE.InstancedMesh(PRESS_BLOCK_GEO, std('#E9E9E3'), 36);
  inst.castShadow = inst.receiveShadow = true;
  const m4 = new THREE.Matrix4();
  const slots = [];
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) {
    const px = x0 + 0.03 + (w - 0.06) / 6 * (i + 0.5), pz = z0 + 0.03 + (d - 0.06) / 6 * (j + 0.5);
    slots.push([px, 0.78 + 0.066, pz]);
    m4.makeTranslation(px, 0.78 + 0.066, pz); inst.setMatrixAt(i * 6 + j, m4);
  }
  g.add(inst);
  return { g, bodies, platen, inst, slots, cx, cz, w, d, x0, z0, x1, z1,
    setPlaten(k) { platen.position.y = lerp(1.45, 0.93, k) + 0.04; cyls.forEach(c => c.scale.y = 1 + k * 0.6); },
    setCount(n) { inst.count = clamp(n, 0, 36); } };
}

/* Pórtico de dosificación Fisnar F5300N.2 sobre la cinta */
function fisnar(parent, cx, cz) {
  const g = group(parent, cx, cz);
  const bodies = [];
  const W = 0.6, D = 0.74, H = 1.55;
  [[-W / 2, -D / 2], [W / 2, -D / 2], [-W / 2, D / 2], [W / 2, D / 2]].forEach(p => bodies.push(bx(g, 0.06, H, 0.06, M.green2, p[0], 0, p[1], { edges: true })));
  bodies.push(bx(g, W + 0.06, 0.08, 0.08, M.green2, 0, H - 0.08, -D / 2, { edges: true }));
  bodies.push(bx(g, W + 0.06, 0.08, 0.08, M.green2, 0, H - 0.08, D / 2, { edges: true }));
  const bridge = group(g, 0, 0, H - 0.08);
  bodies.push(bx(bridge, 0.1, 0.1, D, M.green, 0, -0.02, 0, { edges: true }));
  const carriage = group(bridge, 0, 0, 0);
  bx(carriage, 0.14, 0.18, 0.12, M.dark, 0, -0.14, 0);
  const nozzle = cyl(carriage, 0.015, 0.42, M.steel, 0, -0.56, 0, 10, { rTop: 0.03 });
  // valla de seguridad transparente
  // cerramiento perimetral: dos paneles laterales transparentes (la cinta pasa por los extremos)
  [-1, 1].forEach(sg => { const f = new THREE.Mesh(new THREE.PlaneGeometry(W + 0.5, 1.15), M.fence); f.position.set(0, 0.6, sg * (D / 2 + 0.15)); f.renderOrder = 3; g.add(f);
    bx(g, W + 0.5, 0.03, 0.03, M.green2, 0, 1.17, sg * (D / 2 + 0.15)); });
  // tambor de adhesivo a un lado
  cyl(g, 0.2, 0.55, std('#7E8F86'), W / 2 + 0.35, 0, -D / 2 - 0.1, 18);
  return { g, bodies, bridge, carriage,
    setHead(lx, lz, down) { bridge.position.x = lx; carriage.position.z = lz; carriage.position.y = -down * 0.04; } };
}

function brandPlane(w, h, fg, bg, sub = true) {
  const c = document.createElement('canvas'); c.width = 1400; c.height = Math.round(1400 * h / w);
  const g = c.getContext('2d'), W = c.width, H = c.height;
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, W, H); }
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = fg;
  const big = Math.round(H * (sub ? 0.46 : 0.62));
  g.font = `700 ${big}px Jost, Futura, "Century Gothic", sans-serif`;
  if ('letterSpacing' in g) g.letterSpacing = `${Math.round(big * 0.1)}px`;
  const yBig = sub ? H * 0.56 : H * 0.72;
  g.fillText('DURIWALL', W / 2, yBig);
  g.fillStyle = '#F07A1A'; g.fillRect(W * 0.3, yBig + H * 0.06, W * 0.4, Math.max(4, H * 0.025));
  if (sub) {
    g.fillStyle = fg; const small = Math.round(H * 0.13);
    g.font = `500 ${small}px Jost, Futura, "Century Gothic", sans-serif`;
    if ('letterSpacing' in g) g.letterSpacing = `${Math.round(small * 0.28)}px`;
    g.fillText('ORTIZ & MAKOVEC', W / 2, yBig + H * 0.29);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
}

const N_MIN = -40, N_MAX = 19;
function beltN(t) {
  if (t < STOP[N_MIN].a) return N_MIN;
  let n = N_MIN;
  for (let i = N_MIN; i <= N_MAX; i++) { if (STOP[i].a <= t) n = i; else break; }
  const S = STOP[n];
  if (t < S.b || n === N_MAX) return n;
  return n + ease((t - S.b) / S.s);
}

/* ---------- Movimiento de robots pick & place ---------- */
function polarLerp(R, A, B, k) {
  const aA = Math.atan2(A[2] - R.z, A[0] - R.x), aB = Math.atan2(B[2] - R.z, B[0] - R.x);
  const rA = Math.hypot(A[0] - R.x, A[2] - R.z), rB = Math.hypot(B[0] - R.x, B[2] - R.z);
  const a = angLerp(aA, aB, k), r = lerp(rA, rB, k);
  return [R.x + Math.cos(a) * r, lerp(A[1], B[1], k) + Math.sin(k * Math.PI) * 0.15, R.z + Math.sin(a) * r];
}
// p ∈ [0,1]; A = punto de toma (cara superior), B = punto de depósito. Devuelve estado de la pieza.
function pickPlace(R, p, A, B, yawA = 0, yawB = 0) {
  const H = R.home, up = 0.28;
  const Au = [A[0], A[1] + up, A[2]], Bu = [B[0], B[1] + up, B[2]];
  let tip, held = false, k = 0;
  if (p <= 0 || p >= 1) { R.set(...H, 0); return { held: false, done: p >= 1 }; }
  if (p < 0.22) tip = polarLerp(R, H, Au, ease(p / 0.22));
  else if (p < 0.32) tip = lerp3(Au, A, ease((p - 0.22) / 0.1));
  else if (p < 0.42) { tip = lerp3(A, Au, ease((p - 0.32) / 0.1)); held = true; }
  else if (p < 0.72) { k = ease((p - 0.42) / 0.3); tip = polarLerp(R, Au, Bu, k); held = true; }
  else if (p < 0.82) { k = 1; tip = lerp3(Bu, B, ease((p - 0.72) / 0.1)); held = true; }
  else if (p < 0.9) { k = 1; tip = lerp3(B, Bu, ease((p - 0.82) / 0.08)); }
  else tip = polarLerp(R, Bu, H, ease((p - 0.9) / 0.1));
  const yaw = lerp(yawA, yawB, held ? k : (p >= 0.82 ? 1 : 0));
  R.set(tip[0], tip[1], tip[2], yaw);
  return { held, tip, yaw, k, done: p >= 0.82 };
}

function drawBead(g, prog, x, y, z) { // devuelve la punta [lx, lz]
  g.visible = true; g.position.set(x, y, z);
  let rem = prog * g.userData.total, tip = null;
  for (const s of g.userData.segs) {
    const k = clamp(rem / s.len); rem -= s.len;

    const ex = lerp(s.a[0], s.b[0], k), ez = lerp(s.a[1], s.b[1], k);

function poseComp(m, base, off, yaw = 0, rx = 0, lz = 0) {
  _e.set(rx, yaw, 0, 'YXZ'); _v.set(0, off, lz).applyEuler(_e);
